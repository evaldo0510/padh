name: CI

on:
  push:
    branches:
      - main
      - 'agent/**'
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Security · Lint · Typecheck · Build
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Dependency vulnerability audit
        run: npm audit --audit-level=high

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: |
          npx tsc --project tsconfig.app.json --noEmit
          npx tsc --project tsconfig.node.json --noEmit

      - name: Journey data invariants
        run: npm run test:jornada

      - name: Study curriculum invariants
        run: npm run test:study

      - name: Build
        run: npm run build
