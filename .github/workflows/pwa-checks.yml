name: PWA Quality Checks

on:
  deployment_status:

jobs:
  pwa-tests:
    if: github.event.deployment_status.state == 'success'
    runs-on: ubuntu-latest
    permissions:
      deployments: read
      contents: read
      
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: 'npm'
          
      - name: Install Dependencies
        run: npm ci

      - name: Run Infrastructure Smoke Test
        env:
          TARGET_URL: ${{ github.event.deployment_status.target_url }}
        run: |
          echo "Testing environment: ${{ github.event.deployment_status.environment }}"
          node scripts/pwa-smoke-test.mjs $TARGET_URL

      - name: Install Playwright Browsers
        run: npx playwright install --with-deps

      - name: Run E2E Tests
        env:
          TARGET_URL: ${{ github.event.deployment_status.target_url }}
          TEST_USER_EMAIL: ${{ secrets.TEST_USER_EMAIL }}
          TEST_USER_PASSWORD: ${{ secrets.TEST_USER_PASSWORD }}
        run: npx playwright test

      - name: Upload Playwright Test Artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7
