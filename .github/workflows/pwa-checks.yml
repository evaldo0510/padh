name: PWA Quality Checks

on:
  deployment_status:

jobs:
  pwa-tests:
    if: github.event.deployment_status.state == 'success'
    runs-on: ubuntu-latest
    permissions:
      deployments: read
      contents: read
      
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          
      - name: Install Dependencies
        run: npm ci

      - name: Run Infrastructure Smoke Test
        env:
          TARGET_URL: ${{ github.event.deployment_status.target_url }}
        run: |
          echo "Testing environment: ${{ github.event.deployment_status.environment }}"
          node scripts/pwa-smoke-test.mjs $TARGET_URL

      - name: Install Playwright Browsers
        run: npx playwright install --with-deps chromium

      - name: Run E2E PWA Update Flow Test
        env:
          TARGET_URL: ${{ github.event.deployment_status.target_url }}
          EXPECTED_VERSION: ${{ github.event.deployment_status.environment == 'production' && 'PROD_VERSION_TAG' || 'STAGING_VERSION_TAG' }}
        run: npx playwright test tests/pwa-banner.spec.ts

      - name: Upload Playwright Test Artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
