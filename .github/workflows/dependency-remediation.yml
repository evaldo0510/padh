name: Dependency remediation (temporary)

on:
  push:
    branches:
      - audit/padh-integral-2026-10-30

permissions:
  contents: write

jobs:
  regenerate-lock-and-verify:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout audit branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          persist-credentials: true
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Regenerate lockfile using compatible dependency ranges
        run: |
          npm install
          npm audit fix || true
      - name: Enforce high-severity dependency gate
        run: npm audit --audit-level=high
      - name: Lint and typecheck
        run: |
          npm run lint
          npx tsc --noEmit
      - name: Curriculum and progress invariants
        run: |
          npm run test:jornada
          npm run test:study
          npm run test:livro-curso-progress
      - name: Production build
        run: npm run build
      - name: Commit verified lockfile
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          git diff --cached --quiet || git commit -m "security: regenerate lockfile with patched high-severity dependencies"
          git push origin "HEAD:refs/heads/${{ github.ref_name }}"
