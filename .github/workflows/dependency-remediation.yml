name: Dependency remediation (temporary)

on:
  push:
    branches:
      - audit/padh-integral-2026-10-30

permissions:
  contents: write

jobs:
  remediate:
    if: github.event.head_commit.message != 'fix: remove unused vulnerable dependencies and update Vite'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout audit branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          persist-credentials: true
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Remove unused dependency and update patched Vite
        run: |
          npm pkg delete dependencies.zod devDependencies.lovable-tagger
          npm pkg set devDependencies.vite='^6.4.4'
          sed -i '/import { componentTagger } from "lovable-tagger";/d; s/defineConfig(({ mode }) => (/defineConfig(() => (/; /mode === "development" && componentTagger(),/d' vite.config.ts
          npm install
          npm audit fix || true
      - name: Enforce high-severity dependency gate
        run: npm audit --audit-level=high
      - name: Lint and typecheck
        run: |
          npm run lint
          npx tsc --noEmit
      - name: Curriculum and progress invariants
        run: |
          npm run test:jornada
          npm run test:study
          npm run test:livro-curso-progress
      - name: Production build
        run: npm run build
      - name: Commit validated dependency remediation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json vite.config.ts
          git diff --cached --quiet || git commit -m "fix: remove unused vulnerable dependencies and update Vite"
          git push origin "HEAD:refs/heads/${{ github.ref_name }}"
